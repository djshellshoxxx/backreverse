name: build-and-test
on:
  push:
  pull_request:

concurrency:
  group: backreverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core
        run: cmake -S . -B build -DBACKREVERSE_BUILD_PLUGIN=OFF -DBACKREVERSE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  plugin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBACKREVERSE_BUILD_PLUGIN=ON -DBACKREVERSE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BackReverse-Windows
          path: build/BackReverse_artefacts/Release/**
          if-no-files-found: error
