name: Build, test & release

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.0.2-beta). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION_LABEL: v0.0.2-beta

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core DSP tests
        run: |
          cmake -B build -DBR_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel --target BackReverse_VST3 BackReverse_CLAP BackReverse_Standalone br_core_tests BackReverseStateTest
      - name: Unit, DSP and state tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate VST3 (pluginval, strictness 5)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -oq pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          ./pluginval/pluginval --strictness-level 5 --skip-gui-tests --timeout-ms 600000 --validate "build/src/plugin/BackReverse_artefacts/Release/VST3/BackReverse.vst3"
      - name: Validate CLAP (clap-validator)
        run: |
          # The upstream lockfile pins time 0.3.20, which does not build on current rustc, so the lockfile is not used.
          cargo install --git https://github.com/free-audio/clap-validator --tag 0.3.2
          clap-validator validate "build/src/plugin/BackReverse_artefacts/Release/CLAP/BackReverse.clap" --only-failed
      - name: Package
        run: |
          art=build/src/plugin/BackReverse_artefacts/Release
          v="${{ env.VERSION_LABEL }}"
          mkdir -p dist stage/standalone stage/vst3 stage/clap
          cp "$art/Standalone/BackReverse" stage/standalone/
          cp README.md LICENSE COPYRIGHT-TRADEMARK.md stage/standalone/
          cp -r "$art/VST3/BackReverse.vst3" stage/vst3/
          cp README.md LICENSE stage/vst3/
          cp "$art/CLAP/BackReverse.clap" stage/clap/
          cp README.md LICENSE stage/clap/
          tar -czf "dist/BackReverse-$v-Linux-x86_64-Standalone.tar.gz" -C stage/standalone .
          tar -czf "dist/BackReverse-$v-Linux-x86_64-VST3.tar.gz" -C stage/vst3 .
          tar -czf "dist/BackReverse-$v-Linux-x86_64-CLAP.tar.gz" -C stage/clap .
          (cd dist && sha256sum *.tar.gz > "BackReverse-$v-Linux-x86_64-SHA256SUMS.txt")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: BackReverse-Linux
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel --target BackReverse_VST3 BackReverse_CLAP BackReverse_Standalone br_core_tests BackReverseStateTest
      - name: Unit, DSP and state tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 (pluginval, strictness 5)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -oq pluginval.zip -d pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --timeout-ms 600000 --validate "build/src/plugin/BackReverse_artefacts/Release/VST3/BackReverse.vst3"
      - name: Validate CLAP (clap-validator)
        shell: bash
        run: |
          curl -sSL -o cv.zip https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-windows.zip
          unzip -oq cv.zip -d cv
          "$(find cv -name clap-validator.exe | head -1)" validate "build/src/plugin/BackReverse_artefacts/Release/CLAP/BackReverse.clap" --only-failed
      - name: Package
        shell: pwsh
        run: |
          $art = "build/src/plugin/BackReverse_artefacts/Release"
          $v = "${{ env.VERSION_LABEL }}"
          New-Item -ItemType Directory -Force dist, stage/portable, stage/vst3, stage/clap | Out-Null
          Copy-Item "$art/Standalone/BackReverse.exe", README.md, LICENSE, COPYRIGHT-TRADEMARK.md stage/portable/
          Copy-Item -Recurse "$art/VST3/BackReverse.vst3" stage/vst3/
          Copy-Item README.md, LICENSE stage/vst3/
          Copy-Item "$art/CLAP/BackReverse.clap", README.md, LICENSE stage/clap/
          Compress-Archive -Path stage/portable/* -DestinationPath "dist/BackReverse-$v-Windows-Portable.zip"
          Compress-Archive -Path stage/vst3/* -DestinationPath "dist/BackReverse-$v-Windows-VST3.zip"
          Compress-Archive -Path stage/clap/* -DestinationPath "dist/BackReverse-$v-Windows-CLAP.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBuildDir=$((Resolve-Path $art).Path)" "/DOutDir=$((Resolve-Path dist).Path)" installer/BackReverse.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: BackReverse-Windows
          path: dist/*

  release:
    needs: [ core-tests, linux, windows ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BackReverse-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BackReverse v0.0.2 beta
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
